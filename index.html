<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Rata Bros</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #5c94fc;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
  }
  #game {
    image-rendering: pixelated;
    background: #5c94fc;
    border: 4px solid #1a1a2e;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    max-width: 96vw;
    max-height: 80vh;
  }
  #hud {
    color: #fff;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #00000055;
    display: flex;
    gap: 24px;
    font-size: 18px;
  }
  #hint {
    color: #ffffffcc;
    font-size: 13px;
    text-shadow: 1px 1px 0 #00000055;
  }
  .tag { color: #ffd34d; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>🪙 Monedas: <span id="coins" class="tag">0</span></span>
      <span>😳 Culos: <span id="moons" class="tag">0</span></span>
      <span>⏱️ <span id="time" class="tag">0</span>s</span>
    </div>
    <canvas id="game" width="800" height="400"></canvas>
    <div id="hint">← → o A/D para moverte · ESPACIO / ↑ / W para saltar · Pilla todas las monedas · R para reiniciar</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const coinsEl = document.getElementById("coins");
  const moonsEl = document.getElementById("moons");
  const timeEl  = document.getElementById("time");

  // ---------- Imagen que aparece al pillar una moneda ----------
  // La foto es "rata.jpeg" y está junto a este index.html
  const POPUP_FRAMES = 70;
  const popupImg = new Image();
  let popupReady = false;
  popupImg.onload = () => { popupReady = true; };
  popupImg.src = "rata.jpeg";

  // ---------- Entrada ----------
  const keys = {};
  const DOWN = new Set();
  addEventListener("keydown", e => {
    keys[e.code] = true;
    if (["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code)) e.preventDefault();
    if (e.code === "KeyR") resetGame();
    DOWN.add(e.code);
  });
  addEventListener("keyup", e => { keys[e.code] = false; });

  const left  = () => keys["ArrowLeft"]  || keys["KeyA"];
  const right = () => keys["ArrowRight"] || keys["KeyD"];
  const jump  = () => keys["Space"] || keys["ArrowUp"] || keys["KeyW"];

  // ---------- Mundo ----------
  const GRAV = 0.6;
  const LEVEL_W = 3200;

  // Plataformas: {x,y,w,h}
  let platforms, coins, enemies;

  function buildLevel() {
    platforms = [
      // suelo principal (con un hueco)
      {x:0,    y:360, w:900,  h:40},
      {x:1000, y:360, w:2200, h:40},
      // plataformas flotantes
      {x:260,  y:280, w:120, h:20},
      {x:470,  y:230, w:120, h:20},
      {x:700,  y:180, w:120, h:20},
      {x:980,  y:250, w:140, h:20},
      {x:1250, y:280, w:120, h:20},
      {x:1450, y:220, w:120, h:20},
      {x:1680, y:170, w:140, h:20},
      {x:1980, y:250, w:120, h:20},
      {x:2200, y:200, w:120, h:20},
      {x:2460, y:270, w:160, h:20},
      {x:2760, y:220, w:160, h:20},
    ];

    const coinSpots = [
      [300,240],[330,240],[360,240],
      [510,190],[730,140],[760,140],
      [1020,210],[1290,240],[1490,180],
      [1720,130],[1750,130],[2020,210],
      [2240,160],[2500,230],[2800,180],
      [560,320],[620,320],[1120,320],
      [1180,320],[2000,320],[2600,320],[3000,320]
    ];
    coins = coinSpots.map(([x,y]) => ({x, y, r:10, taken:false, t:Math.random()*Math.PI*2}));

    enemies = [
      {x:600,  y:336, w:30, h:24, dir:-1, minX:500,  maxX:860,  alive:true},
      {x:1300, y:336, w:30, h:24, dir:1,  minX:1050, maxX:1550, alive:true},
      {x:2100, y:336, w:30, h:24, dir:-1, minX:1900, maxX:2400, alive:true},
      {x:2900, y:336, w:30, h:24, dir:1,  minX:2650, maxX:3150, alive:true},
    ];
  }

  // ---------- Jugador (la rata) ----------
  let rata, cam, state, startTime, coinCount, moonCount, moonTimer, win;

  function resetGame() {
    buildLevel();
    rata = {
      x: 60, y: 300, w: 34, h: 26,
      vx: 0, vy: 0,
      onGround: false,
      facing: 1,
      run: 0
    };
    cam = 0;
    state = "play";       // play | dead | win
    coinCount = 0;
    moonCount = 0;
    moonTimer = 0;        // frames restantes de "mostrar el culo"
    startTime = performance.now();
    win = false;
  }

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---------- Lógica ----------
  function update() {
    if (state !== "play") return;

    // movimiento horizontal
    const speed = 3.4;
    if (left())  { rata.vx = -speed; rata.facing = -1; }
    else if (right()) { rata.vx = speed; rata.facing = 1; }
    else rata.vx *= 0.75;

    if (Math.abs(rata.vx) > 0.3 && rata.onGround) rata.run += 0.25;

    // salto
    if (jump() && rata.onGround) {
      rata.vy = -12.2;
      rata.onGround = false;
    }

    // gravedad
    rata.vy += GRAV;
    if (rata.vy > 16) rata.vy = 16;

    // mover X + colisiones
    rata.x += rata.vx;
    for (const p of platforms) {
      if (aabb(rata, p)) {
        if (rata.vx > 0) rata.x = p.x - rata.w;
        else if (rata.vx < 0) rata.x = p.x + p.w;
        rata.vx = 0;
      }
    }
    if (rata.x < 0) rata.x = 0;
    if (rata.x > LEVEL_W - rata.w) rata.x = LEVEL_W - rata.w;

    // mover Y + colisiones
    rata.onGround = false;
    rata.y += rata.vy;
    for (const p of platforms) {
      if (aabb(rata, p)) {
        if (rata.vy > 0) { rata.y = p.y - rata.h; rata.vy = 0; rata.onGround = true; }
        else if (rata.vy < 0) { rata.y = p.y + p.h; rata.vy = 0; }
      }
    }

    // caer al vacío = muerte
    if (rata.y > H + 80) state = "dead";

    // monedas
    const rc = {x: rata.x, y: rata.y, w: rata.w, h: rata.h};
    for (const c of coins) {
      if (c.taken) continue;
      const box = {x:c.x-c.r, y:c.y-c.r, w:c.r*2, h:c.r*2};
      if (aabb(rc, box)) {
        c.taken = true;
        coinCount++;
        moonCount++;
        moonTimer = POPUP_FRAMES;   // aparece la imagen
      }
      c.t += 0.12;
    }

    if (moonTimer > 0) moonTimer--;

    // enemigos
    for (const e of enemies) {
      if (!e.alive) continue;
      e.x += e.dir * 1.3;
      if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }

      if (aabb(rata, e)) {
        // saltar encima lo elimina
        if (rata.vy > 0 && (rata.y + rata.h) - e.y < 18) {
          e.alive = false;
          rata.vy = -8;
        } else {
          state = "dead";
        }
      }
    }

    // victoria: todas las monedas
    if (coins.every(c => c.taken)) { state = "win"; win = true; }

    // cámara sigue a la rata
    const target = rata.x - W/2 + rata.w/2;
    cam += (target - cam) * 0.12;
    cam = Math.max(0, Math.min(cam, LEVEL_W - W));

    // HUD
    coinsEl.textContent = coinCount;
    moonsEl.textContent = moonCount;
    if (state === "play")
      timeEl.textContent = ((performance.now() - startTime) / 1000).toFixed(1);
  }

  // ---------- Dibujo ----------
  function drawBackground() {
    // cielo
    ctx.fillStyle = "#5c94fc";
    ctx.fillRect(0, 0, W, H);

    // nubes (parallax)
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 8; i++) {
      const cx = ((i * 500) - cam * 0.3) % (LEVEL_W) ;
      const x = ((cx % (W + 200)) + (W + 200)) % (W + 200) - 100;
      cloud(x, 60 + (i % 3) * 30);
    }

    // colinas (parallax)
    ctx.fillStyle = "#3fa34d";
    for (let i = 0; i < 10; i++) {
      const hx = (i * 420 - cam * 0.5);
      const x = ((hx % (LEVEL_W)) + LEVEL_W) % LEVEL_W - cam * 0.5 % 1;
      hill(i * 420 - cam * 0.5, 360);
    }
  }
  function cloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, 7);
    ctx.arc(x+22, y+6, 16, 0, 7);
    ctx.arc(x-22, y+6, 16, 0, 7);
    ctx.arc(x, y+12, 18, 0, 7);
    ctx.fill();
  }
  function hill(x, baseY) {
    ctx.beginPath();
    ctx.moveTo(x-90, baseY);
    ctx.quadraticCurveTo(x, baseY-90, x+90, baseY);
    ctx.fill();
  }

  function drawPlatform(p) {
    const x = p.x - cam;
    if (x + p.w < 0 || x > W) return;
    // tierra
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(x, p.y, p.w, p.h);
    // césped
    ctx.fillStyle = "#3fa34d";
    ctx.fillRect(x, p.y, p.w, 8);
    // borde
    ctx.strokeStyle = "#5c3a1a";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, p.y, p.w, p.h);
  }

  function drawCoin(c) {
    if (c.taken) return;
    const x = c.x - cam, y = c.y;
    if (x < -20 || x > W + 20) return;
    const squash = Math.abs(Math.cos(c.t)); // gira
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(Math.max(0.15, squash), 1);
    ctx.fillStyle = "#ffd34d";
    ctx.beginPath();
    ctx.arc(0, 0, c.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "#c48f1b";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#c48f1b";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 1);
    ctx.restore();
  }

  function drawEnemy(e) {
    if (!e.alive) return;
    const x = e.x - cam, y = e.y;
    if (x < -40 || x > W + 40) return;
    // "goomba" verde
    ctx.fillStyle = "#6b4f2a";
    ctx.fillRect(x, y, e.w, e.h);
    ctx.fillStyle = "#3d2d15";
    ctx.fillRect(x, y + e.h - 6, e.w, 6);
    // ojos enfadados
    ctx.fillStyle = "#fff";
    ctx.fillRect(x+5, y+6, 7, 7);
    ctx.fillRect(x+e.w-12, y+6, 7, 7);
    ctx.fillStyle = "#000";
    ctx.fillRect(x+7, y+8, 3, 3);
    ctx.fillRect(x+e.w-10, y+8, 3, 3);
  }

  function drawRat() {
    const x = rata.x - cam, y = rata.y;
    const f = rata.facing;             // 1 derecha, -1 izquierda
    const showMoon = moonTimer > 0;
    const legPhase = Math.sin(rata.run) * 4;

    ctx.save();
    ctx.translate(x + rata.w/2, y + rata.h/2);
    ctx.scale(f, 1);                   // voltea según dirección
    ctx.translate(-rata.w/2, -rata.h/2);

    const gray = "#8a8a99";
    const dark = "#6b6b7a";
    const pink = "#ffb3c1";

    // cola
    ctx.strokeStyle = pink;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-2, rata.h*0.55);
    ctx.quadraticCurveTo(-14, rata.h*0.3, -10, rata.h*0.0);
    ctx.stroke();

    // cuerpo
    ctx.fillStyle = gray;
    roundRect(0, 4, rata.w, rata.h-4, 8);
    ctx.fill();

    // cabeza
    ctx.fillStyle = gray;
    ctx.beginPath();
    ctx.arc(rata.w - 6, 12, 11, 0, Math.PI*2);
    ctx.fill();

    // orejas
    ctx.fillStyle = pink;
    ctx.beginPath();
    ctx.arc(rata.w - 12, 2, 5, 0, Math.PI*2);
    ctx.arc(rata.w - 2, 2, 5, 0, Math.PI*2);
    ctx.fill();

    // ojo
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(rata.w - 2, 11, 2.4, 0, Math.PI*2);
    ctx.fill();

    // naricita
    ctx.fillStyle = pink;
    ctx.beginPath();
    ctx.arc(rata.w + 5, 14, 2.4, 0, Math.PI*2);
    ctx.fill();

    // patas (animadas)
    ctx.fillStyle = dark;
    ctx.fillRect(6, rata.h - 2, 6, 5 + legPhase);
    ctx.fillRect(rata.w - 14, rata.h - 2, 6, 5 - legPhase);

    ctx.restore();

  }

  // Imagen emergente al pillar una moneda (con animación de "pop")
  function drawPopup() {
    if (moonTimer <= 0) return;
    const p = 1 - moonTimer / POPUP_FRAMES;          // 0 -> 1
    // entra con rebote, se mantiene y sale encogiéndose
    let scale;
    if (p < 0.15)      scale = (p / 0.15) * 1.15;
    else if (p < 0.25) scale = 1.15 - ((p - 0.15) / 0.10) * 0.15;
    else if (p < 0.85) scale = 1;
    else               scale = 1 - (p - 0.85) / 0.15;
    scale = Math.max(0, scale);

    const boxH = 250;
    let boxW = 140;
    if (popupReady) boxW = boxH * (popupImg.naturalWidth / popupImg.naturalHeight);

    const cx = rata.x - cam + rata.w / 2;
    const cy = Math.max(boxH / 2 + 12, rata.y - boxH / 2 - 10);
    const px = Math.max(boxW / 2 + 8, Math.min(W - boxW / 2 - 8, cx));

    ctx.save();
    ctx.translate(px, cy);
    ctx.rotate(Math.sin(p * 12) * 0.06);
    ctx.scale(scale, scale);

    // marco blanco tipo polaroid
    ctx.shadowColor = "rgba(0,0,0,.45)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#fff";
    ctx.fillRect(-boxW / 2 - 8, -boxH / 2 - 8, boxW + 16, boxH + 16);
    ctx.shadowBlur = 0;

    if (popupReady) {
      ctx.drawImage(popupImg, -boxW / 2, -boxH / 2, boxW, boxH);
    } else {
      // aviso si falta el archivo
      ctx.fillStyle = "#ddd";
      ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);
      ctx.fillStyle = "#333";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Falta rata.jpeg", 0, -4);
      ctx.fillText("junto a index.html", 0, 14);
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawGoalFlag() {
    const gx = (LEVEL_W - 120) - cam;
    if (gx < -40 || gx > W + 40) return;
    ctx.fillStyle = "#ddd";
    ctx.fillRect(gx, 120, 6, 240);
    ctx.fillStyle = "#e63946";
    ctx.beginPath();
    ctx.moveTo(gx+6, 130);
    ctx.lineTo(gx+46, 142);
    ctx.lineTo(gx+6, 154);
    ctx.fill();
  }

  function drawOverlay(title, subtitle, color) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.font = "bold 44px 'Trebuchet MS', sans-serif";
    ctx.fillText(title, W/2, H/2 - 10);
    ctx.fillStyle = "#fff";
    ctx.font = "20px 'Trebuchet MS', sans-serif";
    ctx.fillText(subtitle, W/2, H/2 + 30);
  }

  function render() {
    drawBackground();
    drawGoalFlag();
    platforms.forEach(drawPlatform);
    coins.forEach(drawCoin);
    enemies.forEach(drawEnemy);
    drawRat();
    drawPopup();

    if (state === "dead")
      drawOverlay("💀 ¡Palmaste!", "Pulsa R para reintentar", "#ff6b6b");
    if (state === "win") {
      const secs = ((performance.now() - startTime) / 1000).toFixed(1);
      drawOverlay("🏆 ¡Rata campeona!", `${coinCount} monedas y ${moonCount} culos en ${secs}s · R para repetir`, "#ffd34d");
    }
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  resetGame();
  loop();
})();
</script>
</body>
</html>
